worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # 记录真实客户端地址：容器前面可能还有一层反代。
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    upstream wigos_backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 20m;

        root /usr/share/nginx/html;
        index index.html;

        # 前端是 SPA：没有文件扩展名的路径一律回 index.html，
        # 否则刷新 /stations 这类路由会 404。
        location / {
            try_files $uri $uri/ /index.html;
        }

        # 带 hash 的构建产物可以长缓存；index.html 必须每次校验。
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
        }

        location /api/ {
            proxy_pass http://wigos_backend;
            proxy_set_header Host $host;
            # Host 不带端口，而浏览器 Origin 带端口 —— 两者永远不相等，
            # CSRF 的"同源豁免"路径也就永远走不到。必须显式传端口，
            # 让 Django 能自己推出正确的 origin（见 settings.py 的
            # CSRF_TRUSTED_ORIGINS 推导），而不是只靠白名单硬扛。
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # WIS2 风格的公开文件服务，即 WNM 里 links[].href 指向的地址。
        location /webstorage/ {
            proxy_pass http://wigos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /admin/ {
            proxy_pass http://wigos_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Django 的 admin 静态资源与 DRF 的浏览界面静态资源。
        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
        }
    }
}