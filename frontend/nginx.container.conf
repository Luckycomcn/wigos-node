# 容器内 nginx 的 server 段。由 frontend/Dockerfile 拷到
# /etc/nginx/conf.d/default.conf —— 那个目录只接受 server 段，不能带
# events/http 外壳（官方 nginx 镜像的 nginx.conf 已经提供了它们）。
#
# 静态文件与反代都在这里：前端是构建产物，/api 与 /webstorage 转到 backend。

upstream wigos_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端是 SPA：没有文件扩展名的路径一律回 index.html，
    # 否则刷新 /stations 这类路由会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存；index.html 必须每次校验。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location /api/ {
        proxy_pass http://wigos_backend;
        # 只传 $host 会丢掉端口，而浏览器 Origin 带端口 —— 两者永远不相等，
        # Django 的同源豁免路径也就永远走不到。必须把带端口的 host 也传过去
        # （X-Forwarded-Host），让 Django 能推出正确的 origin，而不是只靠
        # CSRF_TRUSTED_ORIGINS 白名单硬扛。这正是 BUG-23 的第三环。
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WIS2 风格的公开文件服务，即 WNM 里 links[].href 指向的地址。
    location /webstorage/ {
        proxy_pass http://wigos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://wigos_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Django admin 与 DRF 浏览界面的静态资源。backend 的 entrypoint 会跑
    # collectstatic 写到 /app/staticfiles，compose 里两个容器共用一个卷。
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }
}