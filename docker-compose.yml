
services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: &backend-build
      context: ./backend
      additional_contexts:
        publishing: ./publishing
    restart: unless-stopped
    environment: &backend-environment
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    env_file:
      - .env
    volumes: &backend-volumes
      - ./backend:/app
      - ./publishing:/publishing
      - ./test_data:/test_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Publishes station changes queued in the outbox (backend/outbox), with the
  # backend's image and settings. It doesn't reload on code changes: restart
  # it after editing backend/outbox or publishing/.
  publisher:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    env_file:
      - .env
    volumes: *backend-volumes
    # Not the backend's entrypoint: the backend runs the migrations, and this
    # waits until they are applied. exec makes the worker PID 1, so docker
    # stop's SIGTERM reaches it and it finishes its current events.
    entrypoint:
      - sh
      - -c
      - until python manage.py migrate --check > /dev/null 2>&1; do sleep 2; done; exec python manage.py run_publishers
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      minio:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  # MQTT broker the WNMs are published to. A production deployment points
  # WIS2_BROKER_URL at its own broker, or sets WIS2_PUBLISH_WNM=false.
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:-wis2}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-wis2}
    command:
      - sh
      - -c
      - |
        touch /mosquitto/passwd
        chmod 600 /mosquitto/passwd
        mosquitto_passwd -b /mosquitto/passwd "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        chown mosquitto:mosquitto /mosquitto/passwd
        exec mosquitto -c /mosquitto/config/mosquitto.conf
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    ports:
      - "1883:1883"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1883"]
      interval: 5s
      timeout: 1s
      retries: 3

  # Web storage for the published record files (WIS2): the publisher stores
  # them, WNMs link to them. The S3 API is on 9000, the console on 9001. In
  # development the publisher creates the bucket (WNM_STORAGE_CREATE_BUCKET).
  # wis2box's MinIO build, configured as in wis2box's docker-compose.yml. The
  # image is hardcoded and updated on release.
  minio:
    image: ghcr.io/world-meteorological-organization/wis2box-minio:latest
    restart: unless-stopped
    command: server --quiet --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_LOGIN_ANIMATION: "off"
      MINIO_BROWSER_REDIRECT: "false"
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 1s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
  minio_data:
