# 生产形态。原版这里是开发形态：后端 `runserver`、前端跑 Vite dev server、代码目录
# 用 bind mount 挂进容器。开发形态不能用于交付：
#   - runserver 单进程、无并发、不适合对外；
#   - Vite dev server 会把源码和 HMR 通道暴露出去；
#   - bind mount 让容器内代码随宿主机文件变化，回滚只能靠 git 手工操作。
# 这里改成：gunicorn 跑 WSGI，前端构建产物交给 nginx。
#
# 口令不再有默认值。`${POSTGRES_PASSWORD:?...}` 在未设置时直接报错退出，
# 比"悄悄用 app_password 起来"安全得多。

services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 未设置，见 .env.example}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    # 只绑回环。原版写 "5432:5432" 等于绑 0.0.0.0，把数据库开放给同网段所有人；
    # 配合模板弱口令，任何人都能直连。运维要从宿主机连库走 ssh 隧道即可。
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: &backend-build
      context: ./backend
      additional_contexts:
        publishing: ./publishing
    restart: unless-stopped
    env_file:
      - .env
    environment: &backend-environment
      - POSTGRES_HOST=db
    # 不再挂 ./backend:/app —— 镜像里是构建好的代码，容器内容与镜像一致，
    # 回滚就是换镜像。
    expose:
      - "8000"
    # Django 的 admin 静态资源：entrypoint 里 collectstatic 写到这个卷，
    # frontend 容器以只读方式挂同一个卷，nginx 直接从那里取。
    volumes:
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  # Publishes station changes queued in the outbox (backend/outbox), with the
  # backend's image and settings. It doesn't reload on code changes: restart
  # it after editing backend/outbox or publishing/.
  publisher:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    env_file:
      - .env
    # 不挂卷：镜像里就是构建好的代码，worker 不需要读写宿主机文件。
    # Not the backend's entrypoint: the backend runs the migrations, and this
    # waits until they are applied. exec makes the worker PID 1, so docker
    # stop's SIGTERM reaches it and it finishes its current events.
    entrypoint:
      - sh
      - -c
      - until python manage.py migrate --check > /dev/null 2>&1; do sleep 2; done; exec python manage.py run_publishers
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started
      minio:
        condition: service_healthy

  # Web storage for the published record files (WIS2): the publisher stores
  # them, WNMs link to them. The S3 API is on 9000, the console on 9001. In
  # development the publisher creates the bucket (WNM_STORAGE_CREATE_BUCKET).
  # wis2box's MinIO build, configured as in wis2box's docker-compose.yml. The
  # image is hardcoded and updated on release.
  minio:
    image: ghcr.io/world-meteorological-organization/wis2box-minio:latest
    restart: unless-stopped
    command: server --quiet --console-address ":9001" /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      # 原版这里默认 minioadmin，与库口令同样是公开值，未设置时直接报错退出。
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，见 .env.example}
      MINIO_BROWSER_LOGIN_ANIMATION: "off"
      MINIO_BROWSER_REDIRECT: "false"
      MINIO_UPDATE: "off"
    volumes:
      - minio_data:/data
    # 只绑回环。原版 "9000:9000" 是绑 0.0.0.0：S3 接口带弱口令就等同对外开放读写，
    # 控制台 9001 更是直接把桶内容摆出来。publisher 走 compose 内网 minio:9000，
    # 不需要暴露给宿主机以外。
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 1s
      retries: 3

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - staticfiles:/app/staticfiles:ro
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
  staticfiles:
  minio_data:
