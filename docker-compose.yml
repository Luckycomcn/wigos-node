
services:
  db:
    image: postgis/postgis:15-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app_user} -d ${POSTGRES_DB:-app_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: &backend-build
      context: ./backend
      additional_contexts:
        publishing: ./publishing
    restart: unless-stopped
    environment: &backend-environment
      - POSTGRES_DB=${POSTGRES_DB:-app_db}
      - POSTGRES_USER=${POSTGRES_USER:-app_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-app_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
    env_file:
      - .env
    volumes: &backend-volumes
      - ./backend:/app
      - ./publishing:/publishing
      - ./test_data:/test_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Publishes station changes queued in the outbox (backend/outbox), with the
  # backend's image and settings. It doesn't reload on code changes: restart
  # it after editing backend/outbox or publishing/.
  publisher:
    build: *backend-build
    restart: unless-stopped
    environment: *backend-environment
    env_file:
      - .env
    volumes: *backend-volumes
    # Not the backend's entrypoint: the backend runs the migrations, and this
    # waits until they are applied. exec makes the worker PID 1, so docker
    # stop's SIGTERM reaches it and it finishes its current events.
    entrypoint:
      - sh
      - -c
      - until python manage.py migrate --check > /dev/null 2>&1; do sleep 2; done; exec python manage.py run_publishers
    stop_grace_period: 30s
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ""
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
